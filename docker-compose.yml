# Private, single-organization and local only. Do not expose this stack publicly.
# Generate .env and .demo-credentials.json with scripts/setup_demo_env.py.
x-app-build: &app-build
  build: .
  image: ai-order-agent-private-demo:local

x-database-env: &database-env
  DATABASE_URL: postgresql+psycopg://orders_demo:${DEMO_DB_PASSWORD:?Generate private demo credentials first}@postgres:5432/orders_demo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orders_demo
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Generate private demo credentials first}
      POSTGRES_DB: orders_demo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_demo -d orders_demo"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # Deliberately no published host port.

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    # Deliberately no published host port.

  model-init:
    image: ollama/ollama:latest
    entrypoint: ["/bin/ollama"]
    command: ["pull", "qwen3:0.6b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  db-migrate:
    <<: *app-build
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *database-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-build
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: *database-env
      ORDER_API_KEY_HASHES_JSON: ${ORDER_API_KEY_HASHES_JSON:?Set the hashed bearer token role mapping before starting}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:0.6b
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 15
    restart: unless-stopped

volumes:
  postgres-data:
  ollama-models:
