name: Real LLM Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qwen-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OLLAMA_MODEL: qwen3:0.6b
      OLLAMA_URL: http://127.0.0.1:11434
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:11434/api/tags > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull small Qwen model
        run: ollama pull "$OLLAMA_MODEL"

      - name: Run real LLM smoke test
        run: pytest -q integration_tests/test_real_llm.py

      - name: Show Ollama log on failure
        if: failure()
        run: cat /tmp/ollama.log || true
